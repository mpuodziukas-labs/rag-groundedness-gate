name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests + Evaluation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        # The gate is standard library only. pytest is the only install.
        run: pip install pytest

      - name: Regenerate corpus and eval set
        run: python build_corpus.py

      - name: Corpus must be reproducible (no diff after regeneration)
        run: git diff --exit-code -- corpus

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

      - name: Run evaluation
        # Exits 1 if any ungrounded answer passes or any grounded answer is blocked.
        run: python evaluate.py
