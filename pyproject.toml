[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-groundedness-gate"
version = "0.1.0"
description = "Offline, deterministic groundedness gate for RAG answers. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Puodziukas" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rag-groundedness-gate = "gate:main"

[tool.setuptools]
py-modules = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
